# LeadPulse CRM — Cloudflare Workers & Pages/Static Assets Configuration
name = "leadpulse"
main = "server/cloudflare-worker.js"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "leadpulse"
database_id = "placeholder-d1-id"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "leadpulse-attachments"

[vars]
ALLOW_DEMO = "true"
ENVIRONMENT = "production"

