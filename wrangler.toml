# LeadPulse CRM — Cloudflare Workers & Pages Configuration
name = "leadpulse"
main = "server/cloudflare-worker.js"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]
account_id = "2bffaa0aa7218f8bcd590a12e9ba5c7e"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "leadpulse"
database_id = "ac7f69d2-00fa-461e-8a30-c801bc27c51e"
migrations_dir = "cloudflare/migrations"

[vars]
ALLOW_DEMO = "true"
ENVIRONMENT = "production"

