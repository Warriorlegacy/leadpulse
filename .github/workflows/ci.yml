name: CI

on:
  push:
    # The local repository uses `master`; `main` is kept for a future remote.
    branches: [main, master]
  pull_request:

# Least privilege: no deployment secrets are needed for verification.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and API integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Server boots and health responds
        run: |
          PORT=3100 ALLOW_DEMO=false node server/index.js > /tmp/leadpulse.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/v1/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          kill $SERVER_PID || true
          test -s /tmp/health.json

  browser:
    # T12: responsive, keyboard, console hygiene and axe WCAG A/AA scans
    # against the production build in a real Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
